
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深海遗迹：回响</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      overflow: hidden;
      background-color: #020617;
      margin: 0;
      padding: 0;
    }
    
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    @keyframes match-flash-anim {
      0% { transform: scale(1); filter: brightness(1); opacity: 1; }
      40% { transform: scale(1.3); filter: brightness(4); opacity: 1; }
      100% { transform: scale(0); filter: brightness(6); opacity: 0; }
    }

    .animate-scanline {
      position: absolute;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.1), transparent);
      animation: scanline 8s linear infinite;
      z-index: 50;
      pointer-events: none;
    }

    .match-flash {
      animation: match-flash-anim 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .deep-sea-gradient {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }

    /* LINEAR TRANSITION TO AVOID JUMPING/BOUNCING FEEL */
    .tile-transition {
      transition: all 0.4s linear;
    }

    canvas { pointer-events: none; }
  </style>
